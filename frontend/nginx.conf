# Login gate (see auth-gate/gate.py): every /api/ request needs the session cookie.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Real-IP;
limit_req_zone $binary_remote_addr zone=gate_login:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large PDF uploads (student answer sheets can be 10-30MB)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location = /auth-gate/login {
        limit_req zone=gate_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://auth-gate:9000;
        proxy_set_header Host $host;
    }
    location = /auth-gate/logout {
        proxy_pass http://auth-gate:9000;
    }
    # The website asks this on load to know whether its session is still valid.
    location = /auth-gate/session {
        proxy_pass http://auth-gate:9000/auth-gate/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /_gate_verify {
        internal;
        proxy_pass http://auth-gate:9000/auth-gate/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # CheckerAI API (grading) - Port 8000
    location /api/ {
        auth_request /_gate_verify;
        proxy_pass http://checker-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout for long operations (OCR, grading)
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SetterAI API (paper generation) - Port 8001
    location /api/setter/ {
        auth_request /_gate_verify;
        proxy_pass http://setter-backend:8001/api/setter/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout for paper generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # MentorAI API (student mentoring) - Port 8002
    location /api/mentor/ {
        auth_request /_gate_verify;
        proxy_pass http://mentor-backend:8002/api/mentor/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout for report generation
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
